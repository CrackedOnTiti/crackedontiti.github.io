<!doctype html>
<!-- Source for public/og.png (1200x630). Regenerate with: npm run og -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Montserrat'; src: url('../../public/fonts/montserrat-latin-wght-normal.woff2'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('../../public/fonts/jetbrains-mono-latin-wght-normal.woff2'); font-weight: 100 800; }
  @font-face { font-family: 'IBM Plex Sans'; src: url('../../public/fonts/ibm-plex-sans-latin-wght-normal.woff2'); font-weight: 100 700; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; background: #121212; color: #ece8e1; overflow: hidden; }
  body { padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; font-family: 'IBM Plex Sans', sans-serif; }
  .kicker { font: 500 24px 'JetBrains Mono', monospace; color: #a8a39c; }
  h1 { font: 800 132px/0.92 'Montserrat', sans-serif; letter-spacing: -0.035em; }
  h1 span { display: block; color: #a8a39c; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; }
  .key { border-left: 5px solid #e11d2e; padding-left: 22px; font-size: 30px; line-height: 1.3; max-width: 700px; }
  .handle { font: 500 24px 'JetBrains Mono', monospace; color: #8a857f; }
</style>
</head>
<body>
  <p class="kicker">Cybersecurity · Epitech Toulouse · on exchange at BIT Beijing</p>
  <h1>Thierry<span>Bungaroo</span></h1>
  <div class="foot">
    <p class="key">Looking for an Epitech 5th-year internship after June 2027</p>
    <p class="handle">CrackedOnTiti</p>
  </div>
</body>
</html>
